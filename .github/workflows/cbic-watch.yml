name: CBIC watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this run do?"
        type: choice
        default: normal
        options: [normal, discover, test, dry-run]

permissions:
  contents: write

concurrency:
  group: cbic-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          WATCH_URLS: ${{ vars.WATCH_URLS }}
          CATEGORIES: ${{ vars.CATEGORIES }}
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          if [ "$MODE" = "normal" ]; then python cbic_watch.py
          else python cbic_watch.py --$MODE; fi

      - name: Upload discover output
        if: always() && github.event.inputs.mode == 'discover'
        uses: actions/upload-artifact@v4
        with:
          name: discover
          path: discover/

      - name: Save memory of sent documents
        if: always()
        run: |
          git config user.name "cbic-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "state: update seen documents [skip ci]"
          git push
